name: Release NetHub portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (ej. 1.3.0). Vacío = usar la de package.json"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determinar versión y etiqueta
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $input_ = "${{ github.event.inputs.version }}"
          $version = if ($input_.Trim()) { $input_.Trim().TrimStart("v") } else { $pkg.version }
          $tag = "v$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version  Tag: $tag"

      - name: Instalar dependencias
        run: npm install

      - name: Construir ejecutable portable
        run: npm run build:portable

      - name: Renombrar ejecutable a NetHub.exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist-electron -Filter *.exe -File |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "No se ha encontrado ningun .exe en dist-electron" }
          $target = Join-Path dist-electron "NetHub.exe"
          if ($exe.FullName -ne (Resolve-Path -LiteralPath $target -ErrorAction SilentlyContinue)) {
            Move-Item -LiteralPath $exe.FullName -Destination $target -Force
          }
          Get-ChildItem dist-electron

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: NetHub ${{ steps.ver.outputs.tag }}
          body: |
            NetHub ${{ steps.ver.outputs.version }} — ejecutable portable de Windows.

            Descarga **NetHub.exe** y ejecútalo. Desde la propia app puedes comprobar
            actualizaciones y se instalarán solas.
          files: dist-electron/NetHub.exe
          generate_release_notes: true
