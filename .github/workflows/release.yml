name: Release NetHub portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (ej. 1.3.2). Debe coincidir con package.json. Vacío = usar la de package.json"
        required: false
        default: ""
      draft:
        description: "Crear la release como BORRADOR (Draft). Recomendado: true hasta probar NetHub.exe"
        type: boolean
        required: true
        default: true
  # Un tag vX.Y.Z también construye, pero SIEMPRE como borrador (nunca publica sola).
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determinar y validar versión y etiqueta
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkgVersion = "$($pkg.version)".Trim()
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $input_ = "${{ github.event.inputs.version }}"
            $version = if ($input_.Trim()) { $input_.Trim().TrimStart("v") } else { $pkgVersion }
          }
          # Esquema oficial: semver estricto X.Y.Z (nada de "v15").
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$version' no es semver X.Y.Z" }
          if ($version -ne $pkgVersion) { throw "La version $version no coincide con package.json ($pkgVersion)" }
          $tag = "v$version"
          # No sobrescribir nunca una release existente.
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { throw "La release $tag ya existe; no se sobrescribe." }
          $global:LASTEXITCODE = 0
          # En ejecución manual el tag aún no debe existir (si se lanza por tag, ese tag es el propio disparo).
          if ("${{ github.ref_type }}" -ne "tag") {
            $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
            if ($remoteTag) { throw "El tag $tag ya existe; no se reutiliza." }
          }
          # Draft: manual -> opción elegida (por defecto true); por tag -> siempre borrador.
          $draft = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.draft }}" } else { "true" }
          if ($draft -ne "false") { $draft = "true" }
          $latest = if ($draft -eq "true") { "false" } else { "true" }
          "draft=$draft" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "latest=$latest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version  Tag: $tag  Draft: $draft  Latest: $latest"

      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Construir ejecutable portable
        run: npm run build:portable

      - name: Comprobar iconos empaquetados de Windows
        shell: pwsh
        run: |
          foreach ($name in @("favicon.ico", "app-icon.png")) {
            $source = Join-Path "public" $name
            $packed = Join-Path "dist-electron/win-unpacked/resources/icons" $name
            if (-not (Test-Path -LiteralPath $packed)) { throw "Falta el icono empaquetado: $name" }
            if ((Get-FileHash -LiteralPath $source).Hash -ne (Get-FileHash -LiteralPath $packed).Hash) {
              throw "El icono empaquetado no coincide: $name"
            }
          }

      - name: Renombrar ejecutable a NetHub.exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist-electron -Filter *.exe -File |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "No se ha encontrado ningun .exe en dist-electron" }
          $target = Join-Path dist-electron "NetHub.exe"
          if ($exe.FullName -ne (Resolve-Path -LiteralPath $target -ErrorAction SilentlyContinue)) {
            Move-Item -LiteralPath $exe.FullName -Destination $target -Force
          }
          if (-not (Test-Path -LiteralPath $target)) { throw "Falta dist-electron/NetHub.exe" }
          Get-ChildItem dist-electron

      - name: Crear release (borrador o pública)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ steps.ver.outputs.draft == 'true' }}
          make_latest: ${{ steps.ver.outputs.latest }}
          fail_on_unmatched_files: true
          name: NetHub ${{ steps.ver.outputs.tag }}
          body: |
            NetHub ${{ steps.ver.outputs.version }} — ejecutable portable de Windows.

            Descarga **NetHub.exe** y ejecútalo. Desde la propia app puedes comprobar
            actualizaciones y se instalarán solas.
          files: dist-electron/NetHub.exe
          generate_release_notes: true
